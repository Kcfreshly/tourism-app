# Full production-style stack (not used for local development; see
# docker-compose.yml for the local database): PostgreSQL, a one-off migration
# job, the web app and (optionally) Kemi. Copy .env.production.example to .env,
# fill it in, then:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile kemi up -d --build
# See docs/DEPLOYMENT.md.

x-app-env: &app-env
  APP_MODE: demo
  # The app refuses to run in production unless this is set: it is still the
  # fictional demo with checkout disabled. Remove only when live payments ship.
  ALLOW_LOCAL_DEMO_BUILD: "true"
  LIVE_CHECKOUT_ENABLED: "false"
  PAYMENT_PROVIDER: disabled
  PLANNER_PROVIDER: deterministic
  DATABASE_URL: postgres://${POSTGRES_USER:-fastlife}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fastlife}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastlife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fastlife}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *app-env
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL, e.g. https://fastlife.example.com}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 48)}
      KEMI_ENABLED: ${KEMI_ENABLED:-false}
      KEMI_URL: http://kemi:4100
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  kemi:
    profiles: ["kemi"]
    build:
      context: services/kemi
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    # Internal only: the web app proxies to it.
    expose:
      - "4100"

volumes:
  db-data:
